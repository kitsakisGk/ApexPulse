[project]
name = "apexpulse"
version = "0.1.0"
description = "Real-time esports telemetry ingestion and live win-probability engine for CS2."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "George Kitsakis" }]
keywords = ["esports", "telemetry", "streaming", "kafka", "machine-learning", "cs2"]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "orjson>=3.10",
    "typer>=0.12",
]

[project.optional-dependencies]
stream = [
    "confluent-kafka>=2.5",
    "redis>=5.1",
]
storage = [
    "duckdb>=1.1",
    "pyarrow>=17.0",
]
ml = [
    "numpy>=2.1",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.31",
    "websockets>=13.1",
]

[project.scripts]
apexpulse = "apexpulse.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-redis>=4.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexpulse"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # unused arguments
    "SIM",  # flake8-simplify
    "TCH",  # type-checking imports
    "PTH",  # use pathlib
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["apexpulse"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "duckdb.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
markers = [
    "integration: tests requiring live infrastructure (kafka, redis)",
    "slow: tests exceeding one second of wall time",
]

[tool.coverage.run]
source = ["src/apexpulse"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
